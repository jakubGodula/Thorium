<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Thorium XDR">
  <defs>
    <linearGradient id="thoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="thoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shield (XDR / defense) -->
  <path d="M64 8 L112 24 V60 C112 92 92 112 64 120 C36 112 16 92 16 60 V24 Z"
        fill="#0f1424" stroke="url(#thoGrad)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Atomic orbits (Thorium = element) -->
  <g fill="none" stroke="url(#thoGrad)" stroke-width="3" filter="url(#thoGlow)">
    <ellipse cx="64" cy="62" rx="34" ry="13"/>
    <ellipse cx="64" cy="62" rx="34" ry="13" transform="rotate(60 64 62)"/>
    <ellipse cx="64" cy="62" rx="34" ry="13" transform="rotate(120 64 62)"/>
  </g>
  <circle cx="64" cy="62" r="6" fill="url(#thoGrad)" filter="url(#thoGlow)"/>
  <!-- Element symbol -->
  <text x="64" y="103" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
        font-size="16" font-weight="700" fill="url(#thoGrad)">Th</text>
</svg>
