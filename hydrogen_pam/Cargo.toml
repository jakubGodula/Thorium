[package]
name = "hydrogen_pam"
version = "0.1.0"
edition = "2021"

[lib]
name = "pam_hydrogen"
crate-type = ["cdylib"]

[dependencies]
# Biblioteki ułatwiające zapytania HTTP do demona Thorium (Agenta) lub weryfikację FIDO2
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
